    <script>
        const manifestData = {
            "name": "HomeShare App",
            "short_name": "HomeShare",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#090d16",
            "theme_color": "#090d16",
            "icons": [
                {
                    "src": "https://img.icons8.com/?size=100&id=wFfu6zXx15Yk&format=png&color=000000",
                    "sizes": "100x100",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
                `;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW failed', err));
            });
        }
    </script>

        .theme-amber { color: #fbbf24; background: rgba(245, 158, 11, 0.12); border-color: rgba(251, 191, 36, 0.25); }

        .theme-slate { color: #94a3b8; background: rgba(100, 116, 139, 0.12); border-color: rgba(148, 163, 184, 0.25); }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: #121824; border: 1px solid #1e293b; padding: 12px 16px; border-radius: 14px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); font-size: 0.875rem; display: flex; align-items: center; gap: 12px; animation: toastIn 0.3s forwards; }
        .toast.fade-out { animation: toastOut 0.3s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-accentGreen text-lg"></i>' : '<i class="fa-solid fa-circle-exclamation text-red-400 text-lg"></i>';
            toast.innerHTML = `${icon} <span class="text-white text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        function updateConnectionStatus(isConnected) {
            const indicator = document.getElementById('connection-status');
            if(indicator) {
                indicator.className = isConnected 
                    ? "w-2.5 h-2.5 rounded-full bg-accentGreen shadow-[0_0_8px_rgba(16,185,129,0.8)]" 
                    : "w-2.5 h-2.5 rounded-full bg-slate-600 shadow-[0_0_8px_rgba(71,85,105,0.5)]";
            }
        }

        function getProviderStyle(typeName) {
            if(!typeName) return { icon: 'fa-file-invoice', theme: 'theme-slate' };
            const lower = typeName.toLowerCase();
            if(lower.includes('apă') || lower.includes('water')) return { icon: 'fa-droplet', theme: 'theme-blue' };
            if(lower.includes('curent') || lower.includes('gaz') || lower.includes('eneco')) return { icon: 'fa-bolt', theme: 'theme-amber' };
            if(lower.includes('internet') || lower.includes('proximus')) return { icon: 'fa-wifi', theme: 'theme-purple' };
            if(lower.includes('chirie')) return { icon: 'fa-house', theme: 'theme-teal' };
            return { icon: 'fa-file-invoice', theme: 'theme-slate' };
        }

        window.switchTab = function(tab) {
            window.state.currentTab = tab;
            
            ['facturi', 'locatari', 'furnizori', 'setari'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const iconContainer = document.getElementById(`icon-${t}`);
                const text = document.getElementById(`text-${t}`);
                
                if(!btn) return;
                if (t === tab) {
                    btn.classList.add('text-amber-500');
                    btn.classList.remove('text-slate-400', 'hover:text-white');
                    if(iconContainer) {
                        iconContainer.className = "w-12 h-12 flex items-center justify-center rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 text-slate-950 shadow-lg shadow-amber-500/20 transform -translate-y-2 transition-all";
                        iconContainer.innerHTML = getNavIcon(t, 'xl');
                    }
                    if(text) {
                        text.classList.remove('mt-1', 'font-medium');
                        text.classList.add('mt-[-4px]', 'font-semibold');
                    }
                } else {
                    btn.classList.remove('text-amber-500');
                    btn.classList.add('text-slate-400', 'hover:text-white');
                    if(iconContainer) {

        window.calculateShares = function(bill) {
            const start = new Date(bill.startDate + 'T12:00:00Z');
            const end = new Date(bill.endDate + 'T12:00:00Z');
            const msPerDay = 1000 * 60 * 60 * 24;
            let totalDays = Math.round((end - start) / msPerDay);
            if (totalDays <= 0) totalDays = 1;

            const dailyCost = bill.amount / totalDays;
            let shares = {};
            window.state.residents.forEach(r => shares[r.id] = 0);

            for (let i = 0; i < totalDays; i++) {
                let currentDay = new Date(start.getTime() + (i * msPerDay));
                let activeResidents = [];
                let totalActiveWeight = 0;

                window.state.residents.forEach(res => {
                    let resStart = new Date(res.startDate + 'T12:00:00Z');
                    let resEnd = res.endDate ? new Date(res.endDate + 'T12:00:00Z') : new Date('2099-12-31');
                    if (currentDay >= resStart && currentDay < resEnd) {
                        activeResidents.push(res);
                        totalActiveWeight += parseInt(res.weight);
                    }
                });

                if (totalActiveWeight > 0) {
                    const costPerWeight = dailyCost / totalActiveWeight;
                    activeResidents.forEach(res => {
                        shares[res.id] += costPerWeight * parseInt(res.weight);
                    });
                }
            }
            return shares;
        };

        function getDueDateBadgeInfo(dueDateStr) {
            if (!dueDateStr) return null;
            const today = new Date();
            today.setHours(0,0,0,0);
            const due = new Date(dueDateStr + 'T00:00:00');
            const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return {
                    class: 'bg-rose-500/20 text-rose-400 border-rose-500/40',
                    text: `Depășit (${Math.abs(diffDays)} zile)`,
                    icon: 'fa-triangle-exclamation'
                };
            } else if (diffDays <= 3) {
                return {
                    class: 'bg-amber-500/20 text-amber-400 border-amber-500/40',
                    text: `Expiră în ${diffDays} ${diffDays === 1 ? 'zi' : 'zile'}`,
                    icon: 'fa-clock'
                };
            } else {
                return {
                    class: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40',
                    text: `Scadent: ${new Date(dueDateStr).toLocaleDateString('ro-RO', {day:'2-digit', month:'short'})}`,
                    icon: 'fa-circle-check'
                };
            }
        }

                    const badgeColor = isPaid ? '#34d399' : '#fb7185';
                    const symbol = isPaid ? '✓' : '✕';
                    const labelText = isPaid ? 'Plătit' : 'Neplătit';

                    if(!isPaid) {
                        unpaidListText.push(`- ${res.name}: ${amount.toFixed(2)} €`);
                    }

                    paymentsExportHTML += `
                        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background-color: #0b101d; border: 1px solid rgba(30, 41, 59, 0.8); border-radius: 16px; margin-bottom: 8px;">

                                <div style="padding: 4px 10px; border-radius: 10px; background-color: ${badgeBg}; border: 1px solid ${badgeBorder}; color: ${badgeColor}; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; min-width: 92px; justify-content: center;">
                                    <span>${symbol}</span> <span>${labelText}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            let dueBadgeExportHTML = badgeInfo ? `
                <div style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background-color: ${badgeInfo.class.includes('emerald') ? 'rgba(6, 78, 59, 0.8)' : badgeInfo.class.includes('amber') ? 'rgba(120, 53, 15, 0.8)' : 'rgba(136, 19, 55, 0.8)'}; border: 1px solid ${badgeInfo.class.includes('emerald') ? 'rgba(16, 185, 129, 0.5)' : badgeInfo.class.includes('amber') ? 'rgba(245, 158, 11, 0.5)' : 'rgba(244, 63, 94, 0.5)'}; color: ${badgeInfo.class.includes('emerald') ? '#34d399' : badgeInfo.class.includes('amber') ? '#fbbf24' : '#fb7185'}; font-size: 10px; font-weight: 700;">
                    ${badgeInfo.text}
                </div>
            ` : '';

            const exportContainer = document.createElement('div');
            exportContainer.style.position = 'fixed';
            exportContainer.style.top = '-9999px';
            exportContainer.style.left = '0';
            exportContainer.style.width = '380px';
            exportContainer.style.padding = '18px';
            exportContainer.style.backgroundColor = '#121824';
            exportContainer.style.fontFamily = "'Inter', sans-serif";
            exportContainer.style.borderRadius = '24px';
            exportContainer.style.border = '1px solid #1e293b';
            exportContainer.style.color = '#f3f4f6';
            exportContainer.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.7)';
            
            exportContainer.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(30, 41, 59, 0.8); padding-bottom: 12px; margin-bottom: 10px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3);">
                            <span style="font-size: 16px;">⚡</span>
                        </div>
                        <div>
                            <div style="font-weight: 700; color: #ffffff; font-size: 12px;">${bill.type}</div>
                            <div style="font-size: 10px; color: #94a3b8; font-weight: 600; margin-top: 2px;">${dStart} — ${dEnd}</div>

                    <div style="text-align: right;">
                        <span style="font-size: 18px; font-weight: 800; color: #ffffff; display: block;">${bill.amount.toFixed(2)} €</span>
                        <div style="margin-top: 4px; display: flex; justify-content: flex-end;">${dueBadgeExportHTML}</div>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    ${paymentsExportHTML}
                </div>
            `;

            document.body.appendChild(exportContainer);

            try {
                const canvas = await html2canvas(exportContainer, {
                    backgroundColor: '#121824',
                    scale: 3,
                    logging: false,
                    useCORS: true
                });
                
                document.body.removeChild(exportContainer);

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `factura_${billId}.png`, { type: 'image/png' });
                    let textMessage = `Factura "${bill.type}" ${bill.amount.toFixed(2)}€\n`;

                    link.href = canvas.toDataURL();
                    link.click();
                    showToast('Imaginea și mesajul au fost pregătite!');

            }

            if(!p) return;
            document.getElementById('prov-id').value = p.id;
            document.getElementById('prov-name').value = p.name;
            document.getElementById('prov-type').value = p.type;
            document.getElementById('provider-modal-title').innerText = 'Editează Furnizor';
            showModal('modal-provider');
        };

        window.saveBill = async (e) => {
            e.preventDefault();
            const id = document.getElementById('bill-id').value;
            const data = {
                type: document.getElementById('bill-type').value,
                amount: parseFloat(document.getElementById('bill-amount').value),
                startDate: document.getElementById('bill-start').value,
                endDate: document.getElementById('bill-end').value,
                dueDate: document.getElementById('bill-due').value
            };
            if(db && auth && auth.currentUser) {
                try {
                    if(id) {
                        await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'bills', id), data);
                    } else {
                        const newId = Date.now().toString();
                        data.id = newId; data.payments = {};
                        await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'bills', newId), data);
                    }
                    closeModal('modal-bill'); showToast('Factură salvată!');
                } catch(err) { console.error(err); }
            }
        };

        window.saveResident = async (e) => {
            e.preventDefault();
            const id = document.getElementById('res-id').value;
            const data = {
                name: document.getElementById('res-name').value,
                startDate: document.getElementById('res-start').value,
                endDate: document.getElementById('res-end').value,
                weight: parseInt(document.getElementById('res-weight').value)
            };
            if(db && auth && auth.currentUser) {
                try {
                    if(id) await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', id), data);
                    else {
                        const newId = Date.now().toString(); data.id = newId;
                        await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', newId), data);
                    }
                    closeModal('modal-resident'); showToast('Locatar salvat!');
                } catch(err) { console.error(err); }
            }
        };

        window.saveProvider = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prov-id').value;
            const data = {
                name: document.getElementById('prov-name').value,
                type: document.getElementById('prov-type').value
            };
            if(db && auth && auth.currentUser) {
                try {
                    if(id) await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', id), data);
                    else {
                        const newId = Date.now().toString(); data.id = newId;
                        await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', newId), data);
                    }
                    closeModal('modal-provider'); showToast('Furnizor salvat!');
                } catch(err) { console.error(err); }
            }
        };

        window.togglePayment = async (billId, resId) => {
            const bill = state.bills.find(b => b.id === billId);
            if(bill) {
                const isPaid = bill.payments[resId] || false;
                const newPayments = { ...bill.payments };
                newPayments[resId] = !isPaid;
                
                bill.payments = newPayments; 
                renderBillsList();
                
                if (db && auth && auth.currentUser) {
                    try {
                        await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'bills', billId), { payments: newPayments });
                    } catch(err) { console.error(err); }
                }
            }
        };

        window.confirmDeleteAction = (type, id) => {
            state.deleteTarget = { type, id };
            showModal('modal-confirm');
        };

        window.executeDelete = async () => {
            if(!state.deleteTarget) return;
            const { type, id } = state.deleteTarget;
            const col = type === 'bill' ? 'bills' : type === 'resident' ? 'residents' : 'providers';
            
            if(db && auth && auth.currentUser) {
                try {
                    await deleteDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', col, id));
                    showToast('Șters cu succes.');
                    closeConfirmModal();
                } catch(err) { console.error(err); }
            }
        };

        function showModal(id) {
            const m = document.getElementById(id);
            const c = document.getElementById(`${id}-content`);
            if(!m || !c) return;
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }, 10);
        }
        window.closeModal = (id) => {
            const m = document.getElementById(id);
            const c = document.getElementById(`${id}-content`);
            if(!m || !c) return;
            m.classList.add('opacity-0'); c.classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        };
        window.closeConfirmModal = () => { state.deleteTarget = null; closeModal('modal-confirm'); };

        window.exportData = () => {
            const data = { residents: state.residents, bills: state.bills, providers: state.providers };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `homeshare_backup.json`;
            a.click(); URL.revokeObjectURL(url);
            showToast('Backup descărcat!');
        };
        window.importData = (e) => {
            if(!db || !auth.currentUser) return;
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(data.residents) for(let r of data.residents) await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', r.id), r);
                    if(data.bills) for(let b of data.bills) await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'bills', b.id), b);
                    if(data.providers) for(let p of data.providers) await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', p.id), p);
                    showToast('Date importate!');
                } catch(err) { console.error(err); }
            };
            reader.readAsText(file);
        };

        async function initApp() {
            try {
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    try { await signInWithCustomToken(auth, token); } 
                    catch (e) { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) throw new Error("Auth failed");
                updateConnectionStatus(true);

                onSnapshot(collection(db, 'artifacts', platformAppId, 'public', 'data', 'residents'), 
                    (snap) => {
                        state.residents = [];
                        snap.forEach(d => state.residents.push({id: d.id, ...d.data()}));
                        if(state.residents.length === 0) {
                            defaultResidents.forEach(res => setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', res.id), res));
                        }
                        if(state.currentTab === 'locatari' || state.currentTab === 'facturi') renderCurrentView();
                    }, (err) => updateConnectionStatus(false)
                );

                onSnapshot(collection(db, 'artifacts', platformAppId, 'public', 'data', 'providers'), 
                    (snap) => {
                        state.providers = [];
                        snap.forEach(d => state.providers.push({id: d.id, ...d.data()}));
                        if(state.providers.length === 0) {
                            defaultProviders.forEach(prov => setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', prov.id), prov));
                        }
                        if(state.currentTab === 'furnizori' || state.currentTab === 'facturi') renderCurrentView();
                    }
                );

                onSnapshot(collection(db, 'artifacts', platformAppId, 'public', 'data', 'bills'), 
                    (snap) => {
                        state.bills = [];
                        snap.forEach(d => state.bills.push({id: d.id, ...d.data()}));
                        if(state.currentTab === 'facturi') renderCurrentView();
                    }
                );

            } catch (e) {
                updateConnectionStatus(false);
                state.residents = [...defaultResidents];
                state.providers = [...defaultProviders];
                renderCurrentView();
            }
        }

        window.onload = () => {
            switchTab('facturi');
            initApp();
        };
    </script>
</body>
</html>
