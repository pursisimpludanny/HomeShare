    <!-- PWA Manifest & Service Worker Setup -->
    <script>
        const manifestData = {
            "name": "HomeShare Utility App",
            "short_name": "HomeShare",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#090d16",
            "theme_color": "#090d16",
            "icons": [
                {
                    "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23f4f4f4' d='M42,39H6V20L24,3l18,17V39z'/%3E%3C/svg%3E",
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request)); });`;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed', err));
            });
        }
    </script>

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-accentGreen text-lg"></i>' : '<i class="fa-solid fa-circle-exclamation text-red-400 text-lg"></i>';
            toast.innerHTML = `${icon} <span class="text-white text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        function updateConnectionStatus(isConnected) {
            const indicator = document.getElementById('connection-status');
            indicator.className = isConnected 
                ? "w-2.5 h-2.5 rounded-full bg-accentGreen shadow-[0_0_8px_rgba(16,185,129,0.8)]" 
                : "w-2.5 h-2.5 rounded-full bg-slate-600 shadow-[0_0_8px_rgba(71,85,105,0.5)]";
        }

        function getProviderStyle(typeName) {
            if(!typeName) return { icon: 'fa-file-invoice', theme: 'theme-slate' };
            const lower = typeName.toLowerCase();
            if(lower.includes('apă') || lower.includes('water')) return { icon: 'fa-droplet', theme: 'theme-blue' };
            if(lower.includes('curent') || lower.includes('gaz') || lower.includes('eneco')) return { icon: 'fa-bolt', theme: 'theme-amber' };
            if(lower.includes('internet') || lower.includes('proximus')) return { icon: 'fa-wifi', theme: 'theme-purple' };
            if(lower.includes('chirie')) return { icon: 'fa-house', theme: 'theme-teal' };
            return { icon: 'fa-file-invoice', theme: 'theme-slate' };
        }

        window.switchTab = function(tab) {
            window.state.currentTab = tab;
            
            ['facturi', 'locatari', 'furnizori', 'setari'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const iconContainer = document.getElementById(`icon-${t}`);
                const text = document.getElementById(`text-${t}`);
                
                if (t === tab) {
                    btn.classList.add('text-amber-500');
                    btn.classList.remove('text-slate-400', 'hover:text-white');
                    iconContainer.className = "w-12 h-12 flex items-center justify-center rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 text-slate-950 shadow-lg shadow-amber-500/20 transform -translate-y-2 transition-all";
                    iconContainer.innerHTML = getNavIcon(t, 'xl');

        window.calculateShares = function(bill) {
            const start = new Date(bill.startDate + 'T12:00:00Z');
            const end = new Date(bill.endDate + 'T12:00:00Z');
            const msPerDay = 1000 * 60 * 60 * 24;
            let totalDays = Math.round((end - start) / msPerDay);
            if (totalDays <= 0) totalDays = 1;

            const dailyCost = bill.amount / totalDays;
            let shares = {};
            window.state.residents.forEach(r => shares[r.id] = 0);

            for (let i = 0; i < totalDays; i++) {
                let currentDay = new Date(start.getTime() + (i * msPerDay));
                let activeResidents = [];
                let totalActiveWeight = 0;

                window.state.residents.forEach(res => {
                    let resStart = new Date(res.startDate + 'T12:00:00Z');
                    let resEnd = res.endDate ? new Date(res.endDate + 'T12:00:00Z') : new Date('2099-12-31');
                    if (currentDay >= resStart && currentDay < resEnd) {
                        activeResidents.push(res);
                        totalActiveWeight += parseInt(res.weight);
                    }
                });

                if (totalActiveWeight > 0) {
                    const costPerWeight = dailyCost / totalActiveWeight;
                    activeResidents.forEach(res => {
                        shares[res.id] += costPerWeight * parseInt(res.weight);
                    });
                }
            }
            return shares;
        };

        window.shareCard = async function(billId) {

            const exportContainer = document.createElement('div');

            exportContainer.style.top = '-9999px';

            exportContainer.style.width = '380px';

                    const badgeBorder = isPaid ? 'rgba(16, 185, 129, 0.6)' : 'rgba(239, 68, 68, 0.6)';
                    const badgeColor = isPaid ? '#34d399' : '#f87171';
                    const symbol = isPaid ? '✓' : '✕';

                    paymentsExportHTML += `
                        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background-color: #0d121c; border: 1px solid rgba(30, 41, 59, 0.6); border-radius: 12px; margin-bottom: 8px;">

                                    ${symbol}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            exportContainer.innerHTML = `
                <div style="display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid rgba(30, 41, 59, 0.8); padding-bottom: 14px; margin-bottom: 12px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3);">
                            <span style="font-size: 18px; font-weight: bold;">⚡</span>
                        </div>
                        <div>
                            <div style="font-weight: 800; color: #ffffff; font-size: 15px;">${bill.type}</div>
                            <div style="font-size: 12px; color: #94a3b8; font-weight: 500; margin-top: 3px;">${dStart} — ${dEnd}</div>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span style="font-size: 22px; font-weight: 900; color: #ffffff;">${bill.amount.toFixed(2)} €</span>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    ${paymentsExportHTML}
                </div>
            `;

            document.body.appendChild(exportContainer);

            try {
                const canvas = await html2canvas(exportContainer, {
                    backgroundColor: '#121824',
                    scale: 3,
                    logging: false,
                    useCORS: true
                });
                
                document.body.removeChild(exportContainer);

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `factura_${billId}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Factură HomeShare',
                                text: `Salut! Iată repartizarea facturii.`
                            });
                            return;
                        } catch (err) {
                            console.log('Share canceled', err);
                        }
                    }
                    
                    const link = document.createElement('a');
                    link.download = `factura_utilitati.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    showToast('Imaginea a fost descărcată cu succes!');
                });
            } catch (err) {
                if(document.body.contains(exportContainer)) document.body.removeChild(exportContainer);
                console.error(err);
                showToast('Nu s-a putut genera imaginea.', 'error');
            }
        };

                    if(id) await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', id), data);
                    else {
                        const newId = Date.now().toString(); data.id = newId;
                        await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', newId), data);
                    }
                    closeModal('modal-resident'); showToast('Locatar salvat!');
                } catch(err) { console.error(err); }
            }
        };

        window.saveProvider = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prov-id').value;
            const data = {
                name: document.getElementById('prov-name').value,
                type: document.getElementById('prov-type').value
            };
            if(db && auth && auth.currentUser) {
                try {
                    if(id) await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', id), data);
                    else {
                        const newId = Date.now().toString(); data.id = newId;
                        await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', newId), data);
                    }
                    closeModal('modal-provider'); showToast('Furnizor salvat!');
                } catch(err) { console.error(err); }
            }
        };

        window.togglePayment = async (billId, resId) => {
            const bill = state.bills.find(b => b.id === billId);
            if(bill) {
                const isPaid = bill.payments[resId] || false;
                const newPayments = { ...bill.payments };
                newPayments[resId] = !isPaid;
                
                bill.payments = newPayments; 
                renderBillsList();
                
                if (db && auth && auth.currentUser) {
                    try {
                        await updateDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'bills', billId), { payments: newPayments });
                    } catch(err) { console.error(err); }
                }
            }
        };

        window.confirmDeleteAction = (type, id) => {
            state.deleteTarget = { type, id };
            showModal('modal-confirm');
        };

        window.executeDelete = async () => {
            if(!state.deleteTarget) return;
            const { type, id } = state.deleteTarget;
            const col = type === 'bill' ? 'bills' : type === 'resident' ? 'residents' : 'providers';
            
            if(db && auth && auth.currentUser) {
                try {
                    await deleteDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', col, id));
                    showToast('Șters cu succes.');
                    closeConfirmModal();
                } catch(err) { console.error(err); }
            }
        };

        function showModal(id) {
            const m = document.getElementById(id);
            const c = document.getElementById(`${id}-content`);
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }, 10);
        }
        window.closeModal = (id) => {
            const m = document.getElementById(id);
            const c = document.getElementById(`${id}-content`);
            m.classList.add('opacity-0'); c.classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        };
        window.closeConfirmModal = () => { state.deleteTarget = null; closeModal('modal-confirm'); };

        window.exportData = () => {
            const data = { residents: state.residents, bills: state.bills, providers: state.providers };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `homeshare_backup.json`;
            a.click(); URL.revokeObjectURL(url);
            showToast('Backup descărcat!');
        };
        window.importData = (e) => {
            if(!db || !auth.currentUser) return;
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(data.residents) for(let r of data.residents) await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', r.id), r);
                    if(data.bills) for(let b of data.bills) await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'bills', b.id), b);
                    if(data.providers) for(let p of data.providers) await setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', p.id), p);
                    showToast('Date importate!');
                } catch(err) { console.error(err); }
            };
            reader.readAsText(file);
        };

        async function initApp() {
            try {
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    try { await signInWithCustomToken(auth, token); } 
                    catch (e) { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) throw new Error("Auth failed");
                updateConnectionStatus(true);

                onSnapshot(collection(db, 'artifacts', platformAppId, 'public', 'data', 'residents'), 
                    (snap) => {
                        state.residents = [];
                        snap.forEach(d => state.residents.push({id: d.id, ...d.data()}));
                        if(state.residents.length === 0) {
                            defaultResidents.forEach(res => setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'residents', res.id), res));
                        }
                        if(state.currentTab === 'locatari' || state.currentTab === 'facturi') renderCurrentView();
                    }, (err) => updateConnectionStatus(false)
                );

                onSnapshot(collection(db, 'artifacts', platformAppId, 'public', 'data', 'providers'), 
                    (snap) => {
                        state.providers = [];
                        snap.forEach(d => state.providers.push({id: d.id, ...d.data()}));
                        if(state.providers.length === 0) {
                            defaultProviders.forEach(prov => setDoc(doc(db, 'artifacts', platformAppId, 'public', 'data', 'providers', prov.id), prov));
                        }
                        if(state.currentTab === 'furnizori' || state.currentTab === 'facturi') renderCurrentView();
                    }
                );

                onSnapshot(collection(db, 'artifacts', platformAppId, 'public', 'data', 'bills'), 
                    (snap) => {
                        state.bills = [];
                        snap.forEach(d => state.bills.push({id: d.id, ...d.data()}));
                        if(state.currentTab === 'facturi') renderCurrentView();
                    }
                );

            } catch (e) {
                updateConnectionStatus(false);
                state.residents = [...defaultResidents];
                state.providers = [...defaultProviders];
                renderCurrentView();
            }
        }

        window.onload = () => {
            switchTab('facturi');
            initApp();
        };
    </script>
</body>
</html>
